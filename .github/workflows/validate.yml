name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scripts are executable
        run: |
          missing=0
          for script in scripts/claudeception-activator.sh scripts/skill-inventory.sh \
                        scripts/validate-skill.py tests/run-tests.sh; do
            if [ ! -x "$script" ]; then
              echo "::error file=$script::not executable; run chmod +x $script"
              missing=1
            fi
          done
          exit $missing

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tests/*.sh

      - name: Run test suite
        run: ./tests/run-tests.sh

      - name: Validate bundled skills
        run: python3 scripts/validate-skill.py --strict SKILL.md examples/
