name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plugin dependencies
        run: pip install --quiet sympy mpmath numpy

      - name: Check scripts are executable
        run: |
          missing=0
          for script in scripts/claudeception-activator.sh scripts/skill-inventory.sh \
                        scripts/validate-skill.py tests/run-tests.sh tests/test-calc.sh \
                        tests/test-qamn.sh plugins/verified-math/scripts/calc.py \
                        plugins/quantum-memory/scripts/qamn.py; do
            if [ ! -x "$script" ]; then
              echo "::error file=$script::not executable; run chmod +x $script"
              missing=1
            fi
          done
          exit $missing

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tests/*.sh

      - name: Run test suite
        run: ./tests/run-tests.sh

      - name: Run calc.py test suite
        run: ./tests/test-calc.sh

      - name: Run qamn.py test suite
        run: ./tests/test-qamn.sh

      - name: Validate extracted skills
        # Strict here: SKILL.md and examples/ define the problem/solution/
        # verification shape that Claudeception's own extractions must follow.
        run: python3 scripts/validate-skill.py --strict SKILL.md examples/

      - name: Validate plugin skills
        # Errors only. Plugin skills are hand-written reference documents
        # rather than extracted problem/solution writeups, so the recommended
        # section headings do not apply to them.
        run: python3 scripts/validate-skill.py plugins/
